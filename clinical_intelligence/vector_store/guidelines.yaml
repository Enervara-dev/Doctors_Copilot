guidelines:
  - id: "aha_chest_pain_2021"
    title: "AHA/ACC Chest Pain Guideline"
    organization: "AHA"
    version: "2021"
    evidence_level: "Level A"
    specialty: "cardiology"
    publication_date: "2021-10-28"
    text_content: "For patients presenting with acute chest pain, a 12-lead ECG should be performed and interpreted within 10 minutes of arrival. Troponin levels must be measured. High-sensitivity troponin assays are preferred for diagnosing acute myocardial infarction (STEMI or NSTEMI). Aspirin should be administered immediately unless contraindicated."

  - id: "aha_stroke_2019"
    title: "AHA/ASA Early Management of Ischemic Stroke Guideline"
    organization: "AHA"
    version: "2019"
    evidence_level: "Class I"
    specialty: "neurology"
    publication_date: "2019-10-30"
    text_content: "Patients suspected of acute stroke should undergo urgent noncontrast head CT or brain MRI. Intravenous alteplase (tPA) should be administered to eligible patients with acute ischemic stroke within 3 to 4.5 hours of symptom onset. Keep blood pressure monitored and treated if systolic exceeds 185 mmHg."

  - id: "bts_pneumonia_2015"
    title: "British Thoracic Society Guideline for Community-Acquired Pneumonia"
    organization: "BTS"
    version: "2015"
    evidence_level: "Level B"
    specialty: "pulmonology"
    publication_date: "2015-05-15"
    text_content: "Use CURB-65 score to assess severity and guide admission decisions. Patients with a score of 0-1 are low risk and suitable for home treatment. A score of 2 requires hospital evaluation. Scores of 3 or higher indicate severe pneumonia and require urgent ICU admission. Obtain sputum and blood cultures for severe cases and start empiric antibiotics."

  - id: "esc_heart_failure_2021"
    title: "ESC Guidelines for the Diagnosis and Treatment of Acute and Chronic Heart Failure"
    organization: "ESC"
    version: "2021"
    evidence_level: "Level A"
    specialty: "cardiology"
    publication_date: "2021-08-27"
    text_content: "First-line therapy for heart failure with reduced ejection fraction (HFrEF) includes ACE inhibitors, ARBs, Beta-blockers, and Mineralocorticoid Receptor Antagonists. For acute decompensated heart failure, administer intravenous loop diuretics (e.g. furosemide) promptly to relieve pulmonary congestion. Monitor SpO2 and supplement oxygen if below 90%."

  - id: "acc_hypertension_2017"
    title: "ACC/AHA Guideline for the Prevention, Detection, Evaluation, and Management of High Blood Pressure"
    organization: "ACC"
    version: "2017"
    evidence_level: "Class IIa"
    specialty: "cardiology"
    publication_date: "2017-11-13"
    text_content: "Hypertensive crisis is defined as systolic blood pressure > 180 mmHg or diastolic > 120 mmHg. Hypertensive emergency requires immediate admission to ICU with target BP reduction of no more than 25% within the first hour using IV antihypertensives (e.g. labetalol, nicardipine) if end-organ damage is present."
